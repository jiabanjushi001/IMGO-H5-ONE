<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
	<script type="text/javascript" src="./rtc/adapter-latest.js"></script>
	<script type="text/javascript" src='./js/uni.webview.js'></script>
	<script type="text/javascript" src='./js/utils.js'></script>
	<script type="text/javascript" src='./js/jsonly.js'></script>
	<style>
		body{
			padding:0;
			margin:0;
			background-image: url('image/wallpaper.png');
			background-size: contain;
		}

		.webrtc-box{
		  background: #666;
		  border-radius: 6px;
		  width:100%;
		  box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
		}
		.localvideo{
		    width:100vw;
		    height:100vh;
			object-fit: cover;
		}
		.remotevideo{
		   min-height: 160px;
		   width: 100px;
		   position: fixed;
		   top: 40px;
		   right: 15px;
		   z-index:10;
		   object-fit: cover;
		}
		.recorded-badge{
			position:fixed;
			top:18px;
			left:50%;
			z-index:20;
			transform:translateX(-50%);
			padding:7px 14px;
			border:1px solid rgba(255,255,255,.4);
			border-radius:999px;
			background:rgba(25,32,54,.72);
			color:#fff;
			font-size:13px;
			font-weight:600;
			letter-spacing:.5px;
			backdrop-filter:blur(8px);
		}
		.prepared-source{
			position:fixed;
			left:-4px;
			bottom:-4px;
			width:2px;
			height:2px;
			opacity:.01;
			pointer-events:none;
		}
		
		.call-user-box{
			position:fixed;
			bottom: 20px;
			width:100%;
		}
		
		.call-user{
		  display: flex;
		  justify-content: center;
		  align-items: center;
		  flex-direction: column;
		  margin-bottom:50px;
		}
		.call-user .avatar{
		    width:60px;
		    height:60px;
		    object-fit: contain;
		    border-radius: 50%;
		    overflow: hidden;
		}
		.call-user .text{
			font-size:16px;
			margin-top:15px;
			color:#f6f6f6
		}
		
		.call-time{
			color:#f6f6f6;
			font-size: 24px;
			text-align: center;
		}
		
		.calling-button{
		   display: flex;
		   justify-content: space-around;
		   padding: 20px;
		}
		.calling-button .button{
		    display: flex;
		    flex-direction: column;
		    align-items: center;
		    justify-content: center;
		}
		.calling-button .button .image{
		    width:60px;
		    height:60px;
		    margin-bottom: 10px;
		}
		.calling-button .button .text{
		    color:#f6f6f6;
		}
		.calling-button .switch-btn .text{
			font-size:12px !important; 
		}
		.calling-button .button .image-icon{
		    width:40px;
		    height:40px;
		    margin-bottom: 10px;
		}
		
	</style>
	</head>
	<body>
		<div id="app">
			<div class="webrtc-box">
			<audio id="music1">
			        <source src="./voice/calling.mp3">
			</audio>
			<video ref="preparedvideo" class="prepared-source" muted loop autoplay playsinline webkit-playsinline></video>
			<div v-if="is_video && isRecordedCall" class="recorded-badge">芜湖6</div>
			<video v-show="localStream && is_video" class="localvideo" ref="localvideo"  x5-video-player-fullscreen="true" autoplay x5-playsinline playsinline webkit-playsinline @click="displayBtn = !displayBtn" poster="./image/wallpaper.png"></video>
			    <video v-show="remoteStream && is_video" class="remotevideo" ref="remotevideo" x5-video-player-fullscreen="true" autoplay x5-playsinline playsinline webkit-playsinline @click="changeVideo()" poster="./image/wallpaper.png"></video>
			    <div class="call-user-box" v-if="displayBtn">
			      <div class="call-user" v-if="contact">
			        <img class="avatar" v-if="status!=2 || !is_video" :src="displayAvatar || contact.avatar" alt="">
			        <div class="text"> 
			          <b v-if="!is_video && status==2">{{contact.displayName}}</b>
			          <span v-if="status!=2">
			            <span v-if="status==3"> {{contact.displayName}} 正在请求与您{{is_video ? '视频' : '语音'}}通话</span>
			            <span v-else>您正对 <b>{{contact.displayName}}</b> 发起{{is_video ? '视频' : '语音'}}通话</span>   
			          </span>
					  
			        </div>
			      </div>
				  <div class="call-time" v-if="callTime && status==2">
					  {{setCallTime()}}
				  </div>
			      <div class="calling-button">
			        <div class="button switch-btn" v-if="status<3" >
			          <img class="image-icon" :src="'./image/voice'+(voiceStatus ? '' : '-off')+'.png'" @click="switchVoice()"/>
					  <div class="text">{{ voiceStatus ? '关闭' : '开启'}}麦克风</div> 
			        </div>
					<div class="button" v-if="status!=0" >
					  <img class="image" src="./image/guaduan.png" @click="hangup(true)"/>
					  <div class="text">挂断</div> 
					</div>
					<div class="button" v-if="status==3" >
					  <img class="image" src="./image/jieting.png" @click="answer()"/>
					  <div class="text">接听</div>
					</div>
			        <div class="button switch-btn" v-if="status<3" >
						<template v-if="is_video && !isPreparedSender">
							<img class="image-icon" :src="'./image/video.png'" @click="exchangeVideo()"/>
							<div class="text">切换摄像头</div> 
						</template>
						<template v-else-if="is_video">
							<img class="image-icon" src="./image/video.png"/>
							<div class="text">芜湖5</div>
						</template>
						<template v-else>
						  <img class="image-icon" :src="'./image/speaker'+(speaker ? '' : '-off')+'.png'" @click="speakBtn()"/>
						  <div class="text">{{ speaker ? '关闭' : '开启'}}扬声器</div> 
						</template>
			        </div>
			      </div>
			    </div>
			  </div>
		</div>
	</body>
	<script type="text/javascript" src='./js/vue.js'></script>
	<script>
		const params=parseUrl(window.location.href);
		const opt=JSON.parse(decodeURIComponent(params.stun));
		const config = {
			'iceServers': [{
				'urls': ['stun:stun.xten.com', 'stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302',
				  'stun:stun2.l.google.com:19302', 'stun:stun3.l.google.com:19302', 'stun:stun4.l.google.com:19302'
				]
			  },{
				  'urls': opt.stun ? opt.stun : ['stun:stun.callwithus.com'], // 自己搭建服务器地址
				  "username":opt.stunUser ? opt.stunUser : '',
				  "credential":opt.stunPass ? opt.stunPass : ''
			  }
			],
		  };
		const Counter = {
			data() {
				return {
					displayBtn:true,
					platform:params.platform,
					status: 0,          //状态0，默认，1：拨号中，2通话中，3来电中，4忙线
					pc: null,         //pc实力化
					localVideo: "",    //本地视频的DOM
					remoteVideo: "",   //远程视频的DOM
					remoteStream: null, // 远端视频流
					localStream: null,  // 本地视频流
					is_video: 0,        //是否为视频通话
					videoStatus: true,  //视频开启状态
					voiceStatus: true,  //语音开启状态
					cutdown: 40,        //拨号超时
					timer: null,         //计时器
					offerParams:{},
					plus:null,
					streamType:1, //视频通话展示方式
					facingMode:'user',//前置摄像头还是后置摄像头 user-前置 environment-后置
					headset : true, //麦克风 打开true 关闭false,
					senders: null, // 数据流
					speaker:true, // 听筒 false 扬声器true
					callTime:0, //通话时间
					callTimeDis:'', //通话时间展示
					timerIntervalId:null,  //通话计时器
					displayAvatar:'',
					isRecordedCall:params.video_mode === 'recorded',
					isPreparedSender:params.video_mode === 'recorded' && String(params.status) === '1',
					preparedVideo:null,
					preparedObjectUrl:'',
					messageHandler:null,
					pageExitHandler:null,
						ringPlayPromise:null,
						pendingIceCandidates:[],
						answering:false,
						contact:{
						id:params.target_id,
						displayName:params.name,
						avatar:params.avatar
					}
				};
			},
			mounted() {
				this.resolveContactAvatar();
				this.pc = new RTCPeerConnection(config);
					this.pc.ontrack = (event) => {
						console.log(event,'接收视频流');
						this.stopRinging();
						const incomingStream = event.streams && event.streams[0]
							? event.streams[0]
							: new MediaStream([event.track]);
						if (this.remoteStream && (!event.streams || !event.streams[0])) {
							const exists = this.remoteStream.getTracks().some(track => track.id === event.track.id);
							if (!exists) this.remoteStream.addTrack(event.track);
						} else {
							this.remoteStream = incomingStream;
						}
						this.streamType = 2;
						this.$nextTick(() => this.updateVideoElements());
					};
					this.pc.onconnectionstatechange = () => {
						console.log('WebRTC connection state:', this.pc && this.pc.connectionState);
						if (this.pc && this.pc.connectionState === 'connected') this.stopRinging();
					};
					this.onicecandidate();
				
				if (this.platform === 'app') {
				  document.addEventListener('plusready', () => {
				    console.log('设置扬声器')
				    this.plus = plus.audio.createPlayer();
				    this.plus.setRoute(plus.audio.ROUTE_SPEAKER);
				  });
				}
				
				this.localVideo = this.$refs.localvideo;
				this.remoteVideo = this.$refs.remotevideo;
				this.preparedVideo = this.$refs.preparedvideo;
				
				this.messageHandler = (e) => this.callMessagecallback(e);
				window.addEventListener('message', this.messageHandler, false);
				this.pageExitHandler = () => this.cleanupCall();
				window.addEventListener('pagehide', this.pageExitHandler, false);
				window.addEventListener('beforeunload', this.pageExitHandler, false);
				
				window.getUniAppMessage = (arg) => {
				  const data = {
				    data: jsonly(arg)
				  }
				  this.callMessagecallback(data)
				}
				this.is_video = params.type==1 ? true : false;
				
					this.offerParams = this.is_video ? {
					  offerToReceiveAudio: true,
					  offerToReceiveVideo: true
					} : {
					  offerToReceiveAudio: true,
					  offerToReceiveVideo: false
					}
				this.status=params.status
				// 如果状态为1,表示拨打电话，并且calling状态为1的时候才是直接拨打；
				if(this.status==1){
					if(params.calling==1){
						this.called(this.is_video)
					}
				}else{
					this.playMusicCall('state');
				}
			},
			beforeUnmount() {
				this.cleanupCall();
				if (this.messageHandler) window.removeEventListener('message', this.messageHandler, false);
				if (this.pageExitHandler) {
					window.removeEventListener('pagehide', this.pageExitHandler, false);
					window.removeEventListener('beforeunload', this.pageExitHandler, false);
				}
			},
				watch:{
					streamType(val){
						this.$nextTick(() => this.updateVideoElements());
					}
				},
				methods: {
					playStream(video, stream, muted) {
						if (!video) return;
						if (video.srcObject !== stream) video.srcObject = stream || null;
						video.muted = Boolean(muted);
						video.playsInline = true;
						if (!stream) return;
						const playTask = video.play();
						if (playTask && typeof playTask.catch === 'function') {
							playTask.catch(error => console.warn('video autoplay failed', error));
						}
					},
					updateVideoElements() {
						if (this.streamType == 1) {
							this.playStream(this.localVideo, this.localStream, true);
							this.playStream(this.remoteVideo, this.remoteStream, false);
						} else {
							this.playStream(this.localVideo, this.remoteStream, false);
							this.playStream(this.remoteVideo, this.localStream, true);
						}
					},
				resolveContactAvatar() {
					const raw = decodeURIComponent(this.contact && this.contact.avatar ? this.contact.avatar : (params.avatar || ''))
					const token = decodeURIComponent(params.token || '')
					if (!raw) return
					const needsAuth = /\/storage\//i.test(raw) || /\/avatar\/group-/i.test(raw) || (/\/avatar\//i.test(raw) && /[?&]v=/i.test(raw))
					if (!needsAuth || typeof fetch !== 'function') {
						this.displayAvatar = raw
						return
					}
					fetch(raw, {
						headers: token ? { Authorization: token } : {},
						credentials: 'omit',
						cache: 'no-store'
					}).then((response) => {
						if (!response.ok) throw new Error(String(response.status))
						return response.blob()
					}).then((blob) => {
						this.displayAvatar = URL.createObjectURL(blob)
					}).catch(() => {
						this.displayAvatar = ''
					})
				},
				// 开始通话计时
			    startTime() {
					this.timerIntervalId=setInterval(()=>{
						this.callTime++
					},1000)
			    },
				// 设置通话时间
				setCallTime(){
					let time=this.callTime;
					const hours = Math.floor(time / 3600);
					const minutes = Math.floor((time - (hours * 3600)) / 60);
					const seconds = time - (hours * 3600) - (minutes * 60);
					return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
				},
				async createPreparedStream() {
					const source = decodeURIComponent(params.video_url || '')
					const token = decodeURIComponent(params.token || '')
					if (!source || !this.preparedVideo || typeof fetch !== 'function') {
						throw new Error('prepared video unavailable')
					}
					const response = await fetch(source, {
						headers: token ? { Authorization: token } : {},
						credentials: 'omit',
						cache: 'no-store'
					})
					if (!response.ok) throw new Error('prepared video HTTP ' + response.status)
					const blob = await response.blob()
					this.preparedObjectUrl = URL.createObjectURL(blob)
					this.preparedVideo.src = this.preparedObjectUrl
					this.preparedVideo.currentTime = 0
					await this.preparedVideo.play()
					const capture = this.preparedVideo.captureStream || this.preparedVideo.mozCaptureStream
					if (typeof capture !== 'function') throw new Error('captureStream unsupported')
					const capturedStream = capture.call(this.preparedVideo)
					if (!capturedStream || !capturedStream.getVideoTracks().length) throw new Error('prepared video has no video track')
					if (!capturedStream.getAudioTracks().length) throw new Error('预设视频不包含声音')
					// Send the prepared file's original picture and sound together. The
					// caller microphone is intentionally not mixed into recorded mode.
					return capturedStream
				},
					async createDeviceStream(is_video) {
						if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
							throw new Error('当前浏览器不支持摄像头或麦克风');
						}
						const audio = {
							echoCancellation: true,
							noiseSuppression: true,
							autoGainControl: true
						};
						if (!is_video) return navigator.mediaDevices.getUserMedia({ video: false, audio });
						try {
							return await navigator.mediaDevices.getUserMedia({
								video: {
									facingMode: { ideal: this.facingMode },
									width: { ideal: 1280 },
									height: { ideal: 720 }
								},
								audio
							});
						} catch (error) {
							if (!['OverconstrainedError', 'ConstraintNotSatisfiedError'].includes(error && error.name)) throw error;
							return navigator.mediaDevices.getUserMedia({ video: true, audio });
						}
					},
				    // 视频电话初始化本地视频
				    async initLocalStream(call_id, is_video) {
						const streamTask = this.isPreparedSender && is_video
							? this.createPreparedStream()
							: this.createDeviceStream(is_video)
						try {
								const stream = await streamTask;
								this.localStream = stream;
							// 同步音频
							 stream.getTracks().forEach((track) => {
								this.pc.addTrack(track, stream);
							});
								this.updateVideoElements();
							if(call_id){
								this.postMsg({
									event:'calling',
									status:3,
									code:901
								});
								  // 计时器，如果一段时间没有接听则自动挂断
								this.timer = setInterval(() => {
									this.cutdown--;
									if (this.cutdown == 0) {
										this.hangup(true);
									}
								}, 1000)
							}else{
								// 告诉对方已经接听电话
									this.postMsg({ event: 'acceptRtc',code:904});
								}
								return true;
							} catch (e) {
								console.error('local media error', e)
								this.postMsg({
								  event: 'mediaDevices',
								  name: e && e.name ? e.name : '',
								  message: this.mediaErrorMessage(e),
								})
								return false;
							}
				    },
					mediaErrorMessage(error) {
						const name = error && error.name ? error.name : '';
						if (name === 'NotAllowedError' || name === 'PermissionDeniedError') return '请允许访问摄像头和麦克风';
						if (name === 'NotFoundError' || name === 'DevicesNotFoundError') return '未检测到摄像头或麦克风';
						if (name === 'NotReadableError' || name === 'TrackStartError') return '摄像头或麦克风正在被其他程序使用';
						return error && error.message ? error.message : '无法打开摄像头或麦克风';
					},
			    // 拨打电话
			    called(is_video) {
			      this.is_video = is_video;
			      this.initLocalStream(true, is_video);
			      this.playMusicCall('state');
			    },
			    // 接听电话
				    async answer() {
						if (this.answering) return;
						this.answering = true;
				        this.playMusicCall('close');
						const ready = await this.initLocalStream(false, this.is_video);
						this.answering = false;
						if (!ready) return;
						this.status = 2;
						this.startTime();
				    },
			    // 挂断电话
			    hangup(btn) {
				  this.cleanupCall();
			      if (false && this.status) {
			        this.closeLocalMedia();  //关闭本地媒体
			        this.remoteStream=null;  //关闭远程媒体
			      }
				  // 通话取消
				  let code=902;
				  // 通话中挂断
				  if(this.status==2 ){
					  code=906
					  // 拒绝挂断
				  }else if(this.status==3 ){
					  code=903
					  //对方忙线中
				  }else if(this.status==4 ){
					  code=907
				  }
				  this.postMsg({
				  	event:'hangup',
					isbtn:btn,
					callTime:this.callTime,
					code:code
				  })
			    },
			    // 关闭本地媒体
				    closeLocalMedia() {
			      if (this.localStream && this.localStream.getTracks()) {
			        this.localStream.getTracks().forEach((track) => {
			          track.stop();
			        });
			      }
				      this.localStream = null;
					  if (this.preparedVideo) {
						  this.preparedVideo.pause();
						  this.preparedVideo.removeAttribute('src');
						  this.preparedVideo.load();
					  }
					  if (this.preparedObjectUrl) {
						  URL.revokeObjectURL(this.preparedObjectUrl);
						  this.preparedObjectUrl = '';
					  }
					    },
				stopRinging() {
					const audio = document.getElementById('music1');
					if (!audio) return;
					audio.loop = false;
					audio.pause();
					try { audio.currentTime = 0; } catch (error) {}
					this.ringPlayPromise = null;
				},
				cleanupCall() {
					clearInterval(this.timer);
					clearInterval(this.timerIntervalId);
					this.timer = null;
					this.timerIntervalId = null;
					this.stopRinging();
					this.closeLocalMedia();
					if (this.remoteStream && this.remoteStream.getTracks) {
						this.remoteStream.getTracks().forEach(track => track.stop());
					}
					this.remoteStream = null;
					if (this.pc) {
						this.pc.ontrack = null;
						this.pc.onicecandidate = null;
						if (this.pc.connectionState !== 'closed') this.pc.close();
					}
				},
			    // 打开或关闭声音
			    switchVoice() {
			      if (this.localStream == null) {
			        alert('请打开音视频');
			        return false;
			      }
			      const tracks = this.localStream.getTracks();
			      if (this.voiceStatus) {
			        tracks.forEach(track => {
			          if (track.kind === 'audio') {
			            track.enabled = false
			          }
			        });
			        this.voiceStatus = false;
			      } else {
			        tracks.forEach(track => {
			          if (track.kind === 'audio') {
			            track.enabled = true
			          }
			        });
			        this.voiceStatus = true;
			      }
			    },
			    // 临时开、关视频
			    switchVideo() {
			      if (this.localStream == null) {
			        alert('请打开音视频');
			        return false;
			      }
			      const tracks = this.localStream.getTracks();
			      if (this.videoStatus) {
			        tracks.forEach(track => {
			          if (track.kind === 'video') {
			            track.enabled = false
			          }
			        });
			        this.videoStatus = false;
			      } else {
			        tracks.forEach(track => {
			          if (track.kind === 'video') {
			            track.enabled = true
			          }
			        });
			        this.videoStatus = true;
			      }
			    },
				// 切换前后摄像头
				exchangeVideo() {
					if (this.isPreparedSender) return;
				    this.localStream.getTracks().forEach(track => track.stop());
				    if (this.facingMode == 'user') this.facingMode = 'environment'
				    else this.facingMode = 'user'
				    navigator.mediaDevices.getUserMedia({
				        video: {
							width: window.screen.height,
							height: window.screen.width,
							facingMode: {
							  exact: this.facingMode
							}
					    }, 
					    audio: {
						    echoCancellation: true,
						}
				    }).then((mediastream) =>  {
						this.senders = this.pc.getSenders()
						let videoTrack = mediastream.getVideoTracks()[0];
						let audioTrack = mediastream.getAudioTracks()[0];
						var sender = this.senders.find((s) => {
						  return s.track.kind == 'video';
						});
						var sender2 = this.senders.find((s) => {
						  return s.track.kind == 'audio';
						});
						sender.replaceTrack(videoTrack);
						sender2.replaceTrack(audioTrack);
						if (this.streamType === 2) this.remoteVideo.srcObject = mediastream;
						else this.localVideo.srcObject = mediastream
						this.localStream = mediastream
						if(this.voiceStatus==false){
							this.voiceStatus=true;
							this.switchVoice();
						}
						if(this.speaker){
							this.speaker = !this.speaker
						}else{
							this.speaker = !this.speaker
						}
				  })
				},
			    // 播放响铃
			    playMusicCall(type) {
				  if (type !== 'state') {
					  this.stopRinging();
					  return;
				  }
			      const audio = document.getElementById("music1");
				  if (!audio) return;
				  audio.loop = true;
				  if (audio.paused) {
					  const playTask = audio.play();
					  this.ringPlayPromise = playTask || null;
					  if (playTask && typeof playTask.catch === 'function') {
						  playTask.catch(() => {});
					  }
				  }
			    },
				// 向uniapp发送消息，页面通讯
				postMsg(data) {
				  if (this.platform === 'app') {
				    uni.postMessage({
				      data: data
				    })
				  } else {
				    window.parent.postMessage(data)
				  }
				},
				// 接收websocket发送过来的消息,由uniapp接收后传输到当前页面
					async callMessagecallback(msg){
					let e=msg && msg.data;
					const signalingEvents = ['calling', 'hangup', 'busy', 'forceClose', 'acceptRtc', 'turndown', 'answer', 'iceCandidate', 'offer'];
					if (!e || typeof e !== 'object' || !signalingEvents.includes(e.event)) return;
					if (e.video_mode === 'recorded') this.isRecordedCall = true;
					switch (e.event) {
						case "calling":
							console.log('发起通话...');
							this.called(this.is_video);
							break;
						case "hangup":
							this.hangup(false);
							break;
						case "busy":
							this.status=4;
						    this.hangup(false);
							break;
						case "forceClose":
							this.cleanupCall();
							break;
						case "acceptRtc": //已经接听，创建offer并发送
							this.status = 2;
							clearInterval(this.timer);
							this.startTime();
							this.stopRinging();
							await this.createOffer()
							break;
						case "turndown":
						  break;
							case "answer":
								//同步answer信息...
								await this.setRemoteDescription({
								  type: 'answer',
								  sdp:  e.sdp
								});
								break;
							case "iceCandidate":
								await this.addOrQueueIceCandidate(e.iceCandidate);
								break;
							case "offer":
							  await this.setRemoteDescription({
								type: 'offer',
								sdp: e.sdp
							  });
							  await this.createAnswer();
								break;
						
					}
				},
				// 创建offer-sdp
					async createOffer() {
					  const offer = await this.pc.createOffer(this.offerParams);
					  await this.pc.setLocalDescription(offer);
					  this.postMsg({
					    event: 'offer',
					    sdp: this.pc.localDescription.sdp
					  }, '*');
					},
					// 创建应答sdp
					async createAnswer() {
					  const answer = await this.pc.createAnswer(this.offerParams);
					  await this.pc.setLocalDescription(answer);
					  this.postMsg({
					    event: 'answer',
					    sdp: this.pc.localDescription.sdp
					  }, '*');
					},
					async setRemoteDescription(description) {
						await this.pc.setRemoteDescription(new RTCSessionDescription(description));
						await this.flushPendingIceCandidates();
					},
					parseIceCandidate(candidate) {
						if (!candidate) return null;
						return typeof candidate === 'object' ? candidate : JSON.parse(candidate);
					},
					async addOrQueueIceCandidate(candidate) {
						const parsed = this.parseIceCandidate(candidate);
						if (!parsed) return;
						if (!this.pc.remoteDescription || !this.pc.remoteDescription.type) {
							this.pendingIceCandidates.push(parsed);
							return;
						}
						await this.pc.addIceCandidate(new RTCIceCandidate(parsed));
					},
					async flushPendingIceCandidates() {
						const candidates = this.pendingIceCandidates.splice(0);
						for (const candidate of candidates) {
							await this.pc.addIceCandidate(new RTCIceCandidate(candidate));
						}
					},
				onicecandidate(){
					this.pc.onicecandidate = (event) => {
					  var iceCandidate = event.candidate;
					  if (iceCandidate) {
					    this.postMsg({
					      event: 'iceCandidate',
					      iceCandidate: JSON.parse(JSON.stringify(iceCandidate))
					    }, '*');
					  }
					};
				},
				 //切换视频显示位置
				changeVideo(){
					this.streamType==1 ? this.streamType=2 : this.streamType=1;
				},
				//打开关闭扬声器 h5端就是静音 ROUTE_EARPIECE 听筒 ROUTE_SPEAKER 扬声器
				speakBtn() {
					let isMuted=false;
					let speaker=plus.audio.ROUTE_SPEAKER;
					this.localVideo.muted = true;
					if (this.speaker) { //扬声器 => 听筒    
						isMuted=true;
						speaker=plus.audio.ROUTE_EARPIECE
					}
					if (this.platform === 'h5') {
					  this.localVideo.muted=isMuted;
					}
					if (this.platform === 'app') {
					  this.plus.setRoute(speaker);
					  this.localVideo.muted = false;
					}
					this.speaker = !this.speaker
				}
			  }
		}
	
		const app = Vue.createApp(Counter);
		app.mount('#app');
	</script>
	</html>
