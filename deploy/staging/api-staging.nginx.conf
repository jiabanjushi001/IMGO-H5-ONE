# 放入 Nginx 的 http 上下文，例如 /etc/nginx/conf.d/imgo-staging.conf。
# 替换域名和证书路径后再启用。
map $http_upgrade $imgo_staging_connection_upgrade {
    default upgrade;
    '' close;
}

map $http_origin $imgo_staging_allowed_origin {
    default '';
    'https://app-staging.example.com' $http_origin;
    'https://admin-staging.example.com' $http_origin;
}

server {
    listen 80;
    server_name api-staging.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api-staging.example.com;

    ssl_certificate /etc/letsencrypt/live/api-staging.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-staging.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:IMGoStagingTLS:10m;

    client_max_body_size 210m;
    client_body_timeout 1800s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $imgo_staging_connection_upgrade;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;

        # Go 当前返回通配 CORS；预发布代理将其替换为明确的测试域名。
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $imgo_staging_allowed_origin always;
        add_header Vary Origin always;
    }

    location ~* (\.php|\.phtml|\.phar|/\.) {
        return 404;
    }
}
