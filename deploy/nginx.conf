# Place map in nginx's http block. Replace example.com and configure your TLS certificate.
map $http_upgrade $imgo_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name example.com;
    client_max_body_size 60m;
    # All requests go to Go, including media: do not bypass its file permission checks.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $imgo_connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
    location ~* (\.php|\.phtml|\.phar|/\.) { return 404; }
    # If old clients still use /index.php?s=/..., remove the .php deny rule ONLY
    # for an exact location = /index.php, proxy it to Go, never to PHP-FPM.
}
